<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - KSIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Kantumruy Pro','Inter',sans-serif}.hidden-content{display:none}.loading-pulse{animation:pulse 2s cubic-bezier(0.4,0,0.6,1) infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}</style>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8 border border-slate-200">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-sky-500 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-lg shadow-sky-200"><i class="fa-solid fa-lock"></i></div>
        <h2 class="text-2xl font-bold text-slate-800">Admin Access</h2>
        <p class="text-slate-500 text-sm mt-1">បញ្ចូលលេខសម្ងាត់ដើម្បីចូលប្រើប្រាស់ផ្ទាំងគ្រប់គ្រង</p>
      </div>
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Password</label>
          <input type="password" id="password" placeholder="ksit@2026" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-sky-500 outline-none transition-all">
        </div>
        <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all transform active:scale-[0.98]">Unlock Dashboard</button>
      </form>
    </div>
  </div>
  <div id="dashboardWrapper" class="hidden-content flex flex-col min-h-screen">
    <header class="bg-slate-800 text-white shadow-md sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">          <div class="bg-sky-500 p-1.5 rounded-lg"><i class="fa-solid fa-gauge-high"></i></div>          <h1 class="font-bold text-lg tracking-tight">KSIT Admin</h1>        </div>
        <div class="flex items-center gap-4">          <div id="syncIndicator" class="hidden flex items-center gap-2 text-xs font-medium text-sky-300"><i class="fa-solid fa-circle-notch fa-spin"></i> Syncing...</div>          <button onclick="logout()" class="px-4 py-1.5 bg-rose-600 hover:bg-rose-700 rounded-lg text-sm font-bold transition-all shadow-lg shadow-rose-900/20">Logout</button>        </div>
      </div>
    </header>
    <div class="bg-white border-b border-slate-200 sticky top-[64px] z-30">      <div class="max-w-7xl mx-auto px-6 py-3 flex flex-wrap items-center justify-between gap-4">        <div class="flex items-center gap-2 text-slate-500">          <i class="fa-solid fa-filter text-sky-500"></i>          <span class="text-sm font-bold">តម្រងឆ្នាំ (Year Filter)</span>        </div>        <select id="yearFilter" onchange="handleFilterChange()" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-sky-500 focus:border-sky-500 block p-2.5 font-bold outline-none min-w-[180px]">          <option value="ALL">គ្រប់ឆ្នាំទាំងអស់ ALL</option>          <option value="2026">ឆ្នាំ ២០២៦</option>          <option value="2025">ឆ្នាំ ២០ race</option>          <option value="2024">ឆ្នាំ ២០២៤</option>        </select>      </div>    </div>    <main class="p-6 max-w-7xl mx-auto w-full space-y-8">
      <div id="kpiGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">          <p class="text-xs font-bold text-slate-500 uppercase">Total Responses</p>          <h3 id="totalKpi" class="text-3xl font-bold text-slate-800 mt-1">0</h3>        </div>      </div>      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><canvas id="radarChart"></canvas></div>        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><canvas id="doughnutChart"></canvas></div>      </div>      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><canvas id="barChart"></canvas></div>      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">        <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">          <h3 class="font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-table text-sky-500"></i> Responses Table</h3>          <button onclick="exportCSV()" class="text-sky-600 hover:text-sky-700 font-bold text-sm flex items-center gap-1"><i class="fa-solid fa-download"></i> Export CSV</button>        </div>        <div class="overflow-x-auto">          <table class="w-full text-left">            <thead class="bg-slate-50 text-slate-500 text-xs uppercase font-bold">              <tr><th class="px-6 py-4">Timestamp</th><th class="px-6 py-4">Year</th><th class="px-6 py-4">Student ID</th><th class="px-6 py-4">Details</th></tr>            </thead>            <tbody id="tableBody" class="divide-y divide-slate-100 text-sm"></tbody>          </table>        </div>      </div>      <div id="feedbackWall" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>
  </div>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJsMkU5HJgdyHvsWirk7UG7fSRaHz_6j1q3n9AoxIzitIX8DjCY1XWmwL_cXXYZCA/exec";
    let rawData = []; let charts = {};    document.getElementById('loginForm').onsubmit=function(e){e.preventDefault();if(document.getElementById('password').value==='ksit@2026'){sessionStorage.setItem('auth','true');checkAuth();}else{alert("លេខសម្ងាត់មិនត្រឹមត្រូវ!")}};
    function checkAuth(){if(sessionStorage.getItem('auth')){document.getElementById('loginModal').style.display='none';document.getElementById('dashboardWrapper').classList.remove('hidden-content');fetchData();}else{document.getElementById('loginModal').style.display='flex';document.getElementById('dashboardWrapper').classList.add('hidden-content')}}
    async function fetchData(){document.getElementById('syncIndicator').classList.remove('hidden');try{const r=await fetch(SCRIPT_URL);rawData=await r.json();handleFilterChange();}catch(e){console.error(e)}finally{document.getElementById('syncIndicator').classList.add('hidden')}}
    function handleFilterChange(){const year=document.getElementById('yearFilter').value;const filtered=year==='ALL'?rawData:rawData.filter(d=>new Date(d.Timestamp).getFullYear().toString()===year);updateKpis(filtered);renderCharts(filtered);renderTable(filtered);renderFeedback(filtered);}    function renderTable(data){const b=document.getElementById('tableBody');b.innerHTML=data.map(d=>`<tr><td class="px-6 py-4">${new Date(d.Timestamp).toLocaleDateString()}</td><td class="px-6 py-4 font-bold text-sky-600">${new Date(d.Timestamp).getFullYear()}</td><td class="px-6 py-4">${d['Student ID']||'-'}</td><td class="px-6 py-4">${d.Major||'-'}</td></tr>`).join('')}    function exportCSV(){const year=document.getElementById('yearFilter').value;const data=year==='ALL'?rawData:rawData.filter(d=>new Date(d.Timestamp).getFullYear().toString()===year);const csvContent="data:text/csv;charset=utf-8,"+Object.keys(data[0]||{}).join(",")+"\n"+data.map(r=>Object.values(r).join(",")).join("\n");const encodedUri=encodeURI(csvContent);const link=document.createElement("a");link.setAttribute("href",encodedUri);link.setAttribute("download",`ksit_data_${year}.csv`);document.body.appendChild(link);link.click();}    function logout(){sessionStorage.removeItem('auth');location.reload();}    checkAuth();
  </script>
</body>
</html>
